spring.application.name=backend
server.port=8080
cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
logging.file.name=backend.log

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.thinking-level=LOW
spring.ai.google.genai.chat.include-thoughts=false
spring.ai.google.genai.chat.max-output-tokens=2048
# Channel3 product catalogue (keep the API key in an environment variable)
channel3.api-key=${CHANNEL3_API_KEY:}
channel3.base-url=https://api.trychannel3.com
# India-first catalog currency. Use a disclosed USD fallback only for no-budget searches.
catalog.currency=${CATALOG_CURRENCY:USD}
catalog.fallback-currency=${CATALOG_FALLBACK_CURRENCY:USD}

# Optional Flipkart Affiliate API credentials (never commit these).
flipkart.affiliate-id=${FLIPKART_AFFILIATE_ID:}
flipkart.affiliate-token=${FLIPKART_AFFILIATE_TOKEN:}
flipkart.base-url=${FLIPKART_BASE_URL:https://affiliate-api.flipkart.net}

# Optional Amazon.in Creators API credentials (requires approved Associates/Creators API access).
amazon.creators.client-id=${AMAZON_CREATORS_CLIENT_ID:}
amazon.creators.client-secret=${AMAZON_CREATORS_CLIENT_SECRET:}
amazon.creators.partner-tag=${AMAZON_ASSOCIATES_PARTNER_TAG:}
amazon.creators.marketplace=${AMAZON_MARKETPLACE:www.amazon.in}
amazon.creators.token-url=${AMAZON_TOKEN_URL:https://api.amazon.co.uk/auth/o2/token}
amazon.creators.api-base-url=https://creatorsapi.amazon
# PayPal Sandbox credentials (never commit credentials)
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.brand-name=Quick-Own
# Configure this from the matching Sandbox webhook in PayPal Developer Dashboard.
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
# Local backend-only callbacks; override with frontend URLs when the UI is running.
paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:3000/checkout/success}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:3000/checkout/cancelled}
# Persist pending PayPal checkout sessions across backend restarts.
checkout.storage-path=${CHECKOUT_STORAGE_PATH:./data/checkout-sessions.json}
