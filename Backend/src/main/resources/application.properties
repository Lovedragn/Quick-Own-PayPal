spring.application.name=backend
server.port=8080
cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.thinking-level=LOW
spring.ai.google.genai.chat.include-thoughts=true
spring.ai.google.genai.chat.max-output-tokens=2048
# Channel3 product catalogue (keep the API key in an environment variable)
channel3.api-key=${CHANNEL3_API_KEY:}
channel3.base-url=https://api.trychannel3.com
# PayPal Sandbox credentials (never commit credentials)
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.brand-name=Quick-Own
paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:3000/checkout/success}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:3000/checkout/cancel}
